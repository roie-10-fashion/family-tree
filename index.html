<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עץ משפחת כהן</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a header bar with search and views, the family chart as a pannable canvas, and a profile panel docked on the start (right) side. */
:root{
  --bg:#eef2f1;
  --surface:#ffffff;
  --ink:#1b2929;
  --muted:#5b6b6a;
  --line:#c9d3d1;
  --accent:#1f6b66;
  --accent-soft:#dcebe9;
  --male:#3a6aa6;
  --female:#b04d78;
  --unknown:#8a9493;
  --warn:#b7791f;
  --danger:#b3412f;
  --shadow:0 1px 2px rgba(20,40,40,.08),0 4px 14px rgba(20,40,40,.06);
  --font-display:"Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --font-body:"Assistant","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a1a;--surface:#1b2626;--ink:#e3ecea;--muted:#9aaaa8;--line:#344444;
    --accent:#5fb3ab;--accent-soft:#213a38;--male:#78a3dc;--female:#e087ad;--unknown:#8d9998;
    --warn:#e0a84a;--danger:#e57a66;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a1a;--surface:#1b2626;--ink:#e3ecea;--muted:#9aaaa8;--line:#344444;
  --accent:#5fb3ab;--accent-soft:#213a38;--male:#78a3dc;--female:#e087ad;--unknown:#8d9998;
  --warn:#e0a84a;--danger:#e57a66;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:22px;line-height:1.1}
.brand .stats{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.results{position:absolute;top:100%;inset-inline:0;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:30;display:none}
.results.open{display:block}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:start;padding:7px 12px;border:0;background:none}
.results button:hover,.results button.active{background:var(--accent-soft)}
.results small{color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 9px;font-size:13px}
.banner{padding:8px 16px;background:var(--accent-soft);color:var(--ink);font-size:14px;display:none}
.banner.show{display:block}
.banner.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}

/* main */
.main{flex:1;display:flex;min-height:0}
.panel{width:380px;max-width:100%;background:var(--surface);border-inline-end:1px solid var(--line);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.view{flex:1;min-width:0;position:relative;display:none}
.view.active{display:block}

/* chart */
.canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.canvas.dragging{cursor:grabbing}
.inner{position:absolute;top:0;left:0;transform-origin:0 0;padding:40px 60px}
.inner svg.links{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.links path{fill:none;stroke:var(--line);stroke-width:2}
.links path.uncertain{stroke-dasharray:5 4;stroke:var(--warn)}
.gen{display:grid;grid-template-columns:repeat(8,170px);justify-content:center;margin-bottom:46px}
.gen .slot{display:flex;justify-content:center}
.gen.g1 .slot{grid-column:span 4}.gen.g2 .slot{grid-column:span 2}
.genlabel{position:absolute;inset-inline-start:8px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.row{display:flex;justify-content:center;align-items:flex-start;gap:22px;margin-bottom:46px}
.group{display:flex;flex-direction:column;align-items:center;gap:8px}
.group .kids{display:flex;gap:12px;justify-content:center}
.groupcap{font-size:12px;color:var(--muted)}
.card{width:156px;min-height:78px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--unknown);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:flex-start;text-align:start;cursor:pointer;position:relative}
.card.M{border-top-color:var(--male)}.card.F{border-top-color:var(--female)}
.card:hover{border-color:var(--accent);border-top-color:inherit}
.card.M:hover{border-top-color:var(--male)}.card.F:hover{border-top-color:var(--female)}
.card.focus{outline:3px solid var(--accent);outline-offset:2px;width:180px}
.card.small{width:132px;min-height:60px;opacity:.95}
.card.uncertain{border-style:dashed}
.card.uncertain::after{content:"משוער";position:absolute;bottom:4px;inset-inline-end:6px;font-size:10px;color:var(--warn);font-weight:700}
.card.empty{border:1px dashed var(--line);box-shadow:none;background:transparent;color:var(--muted);justify-content:center;align-items:center;font-size:13px}
.card.empty.disabled{cursor:default}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--unknown);overflow:hidden}
.avatar.M{background:var(--male)}.avatar.F{background:var(--female)}
.avatar img{width:100%;height:100%;object-fit:cover}
.card .nm{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.card .yr{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .mn{font-size:11px;color:var(--muted)}
.zoom{position:absolute;bottom:14px;inset-inline-end:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;box-shadow:var(--shadow)}
.chartopts{position:absolute;top:12px;inset-inline-end:14px;z-index:5;display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:var(--shadow)}
.chartopts label{display:flex;gap:4px;align-items:center}

/* profile */
.prof-head{display:flex;gap:14px;align-items:center}
.prof-head .avatar{width:72px;height:72px;font-size:24px}
.prof-head h2{font-size:24px;line-height:1.15}
.prof-head .sub{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;background:var(--bg);font-size:13px;cursor:pointer}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--unknown)}
.chip .dot.M{background:var(--male)}.chip .dot.F{background:var(--female)}
.chip:hover{border-color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}
.sect h3{font-size:16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.note{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--bg)}
.photos .ph-tools{position:absolute;top:4px;inset-inline-start:4px;display:flex;gap:3px}
.docs{display:flex;flex-direction:column;gap:6px}.docrow{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px}.docicon{font-size:20px}.docmain{flex:1;min-width:0}.doclink{color:var(--accent);font-weight:700;text-decoration:none;border:0;background:none;padding:0;text-align:start;cursor:pointer}.doclink:hover{text-decoration:underline}.multi{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.photos .ph-tools button{font-size:11px;padding:1px 6px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff}
details.src{border-top:1px solid var(--line);padding:6px 0}
details.src summary{cursor:pointer;font-size:14px}
details.src p{white-space:pre-wrap;font-size:13px;color:var(--muted);margin:6px 0}
.addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

/* list view */
.listwrap{position:absolute;inset:0;overflow:auto;padding:16px 20px}
.listtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.surnames{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.surnames button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
.surnames button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
table{border-collapse:collapse;width:100%;background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{background:var(--bg);font-weight:700;cursor:pointer;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accent-soft)}

/* research view */
.research{position:absolute;inset:0;overflow:auto;padding:20px}
.research .inner2{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.rcard h3{font-size:18px;margin-bottom:4px}
.rcard .date{color:var(--muted);font-size:13px}
.rcard p{white-space:pre-wrap;margin:8px 0 0;max-width:65ch}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,20,.45)}
.dlg{padding:18px 20px;display:flex;flex-direction:column;gap:12px;max-height:86vh;overflow:auto}
.dlg h2{font-size:20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.form textarea{min-height:90px;resize:vertical}
.form .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.dlg .foot{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.picker{position:relative}
.picker .results{position:absolute}
.relout{background:var(--bg);border-radius:10px;padding:14px}
.relout .big{font-family:var(--font-display);font-size:22px;color:var(--accent)}
.chain{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.chain ol{margin:0;padding-inline-start:18px;font-size:14px}
.chain h4{margin:0 0 4px;font-size:13px;color:var(--muted)}
.progress{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0}
.lightbox img{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:8px}
.hint{font-size:13px;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:16px;text-align:center;padding:20px}
@media (max-width:820px){
  .main{flex-direction:column}
  .panel{width:100%;max-height:45%;border-inline-end:0;border-bottom:1px solid var(--line);order:2}
  .view{order:1;min-height:55%}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="title">עץ משפחת כהן</h1>
    <div class="stats" id="stats">טוען…</div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="חיפוש אדם בעברית או באנגלית…" autocomplete="off" aria-label="חיפוש אדם">
    <div class="results" id="qres" role="listbox"></div>
  </div>
  <div class="tabs" role="group" aria-label="תצוגה">
    <button id="tab-tree" aria-pressed="true">עץ</button>
    <button id="tab-list" aria-pressed="false">רשימה</button>
    <button id="tab-research" aria-pressed="false">מחקר</button>
  </div>
  <div class="actions">
    <button class="btn" id="btn-rel">מה הקשר?</button>
    <button class="btn edit-only" id="btn-add">הוסף אדם</button>
    <button class="btn" id="btn-io">ייבוא / ייצוא</button>
    <button class="btn" id="btn-out" style="display:none" title="התנתקות מ-Google">יציאה</button>
    <span class="hint" id="savestate" aria-live="polite"></span>
  </div>
</header>
<div class="banner" id="banner"></div>
<div class="main">
  <aside class="panel" id="panel" aria-label="פרטי אדם"></aside>
  <section class="view active" id="view-tree">
    <div class="canvas" id="canvas">
      <div class="inner" id="inner"></div>
    </div>
    <div class="chartopts">
      <label><input type="checkbox" id="opt-sibs" checked> אחים</label>
      <label><input type="checkbox" id="opt-gk"> נכדים</label>
      <label><input type="checkbox" id="opt-gen3" checked> 3 דורות למעלה</label>
    </div>
    <div class="zoom">
      <button id="z-in" aria-label="הגדל">+</button>
      <button id="z-out" aria-label="הקטן">−</button>
      <button id="z-fit" aria-label="מרכז" style="font-size:14px">⌖</button>
    </div>
    <div class="loading" id="loading">טוען את העץ…</div>
  </section>
  <section class="view" id="view-list"><div class="listwrap" id="listwrap"></div></section>
  <section class="view" id="view-research"><div class="research"><div class="inner2" id="research"></div></div></section>
</div>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>
<input type="file" id="file-photo" accept="image/*" multiple hidden>
<input type="file" id="file-ged" accept=".ged,.txt,.json" hidden>

<script>
"use strict";
/* ---------- state ---------- */
const S={people:{},fams:{},meta:{},research:{},famc:{},fams_:{},focus:null,canWrite:false,mode:"loading",db:null,assets:null,downloads:null,
  view:"tree",tx:0,ty:0,sc:1,listSort:{k:"name",dir:1},listSurname:"",loaded:{people:false,families:false}};
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(msg,warn){const b=$("#banner");b.textContent=msg;b.className="banner show"+(warn?" warn":"");clearTimeout(toast.t);toast.t=setTimeout(()=>{if(S.mode!=="local")b.className="banner"},6000)}

/* ---------- names & dates ---------- */
const MONTHS={JAN:"ינו׳",FEB:"פבר׳",MAR:"מרץ",APR:"אפר׳",MAY:"מאי",JUN:"יוני",JUL:"יולי",AUG:"אוג׳",SEP:"ספט׳",OCT:"אוק׳",NOV:"נוב׳",DEC:"דצמ׳"};
function fmtDate(d){if(!d)return"";let s=String(d).trim();
  const tr=x=>x.replace(/\b(\d{1,2}) ([A-Z]{3}) (\d{3,4})\b/g,(m,a,b,c)=>`${a} ${MONTHS[b]||b} ${c}`).replace(/\b([A-Z]{3}) (\d{4})\b/g,(m,b,c)=>MONTHS[b]?`${MONTHS[b]} ${c}`:m);
  let m;
  if((m=s.match(/^BET (.+) AND (.+)$/)))return`בין ${tr(m[1])} ל-${tr(m[2])}`;
  if((m=s.match(/^(ABT|EST|CAL) (.+)$/)))return`בערך ${tr(m[2])}`;
  if((m=s.match(/^BEF (.+)$/)))return`לפני ${tr(m[1])}`;
  if((m=s.match(/^AFT (.+)$/)))return`אחרי ${tr(m[1])}`;
  if((m=s.match(/^(TO|FROM) (.+)$/)))return tr(m[2]);
  return tr(s)}
const yearOf=d=>{const m=String(d||"").match(/(\d{4})/);return m?+m[1]:null};
function fullName(p){if(!p)return"?";const n=[p.given,p.surname].filter(Boolean).join(" ").trim();return n||"ללא שם"}
function shortName(p){if(!p)return"?";const g=(p.given||"").split(/\s+/)[0]||"";const s=(p.surname||"").split(/\s+/)[0]||"";return (g+" "+s).trim()||"ללא שם"}
function lifespan(p){const b=yearOf(p.birthDate),d=yearOf(p.deathDate);if(b&&d)return`${b}–${d}`;if(b)return p.deceased?`${b}–?`:`נ. ${b}`;if(d)return`נפ׳ ${d}`;return p.deceased?"נפטר/ה":""}
function initials(p){const n=fullName(p).replace(/[()"'?]/g,"").trim().split(/\s+/);return((n[0]||"")[0]||"?")+((n[1]||"")[0]||"")}
const norm=s=>String(s||"").toLowerCase().replace(/[֑-ׇ]/g,"").replace(/[׳'"״().,\-]/g," ").replace(/\s+/g," ").trim();
function primaryPhoto(p){const ph=(p.photos||[]);const pr=ph.find(x=>x.primary)||ph[0];return pr?pr.driveId:null}
function avatar(p,cls=""){const a=el("div",{class:`avatar ${p?.sex||""} ${cls}`});const u=p&&primaryPhoto(p);if(u)a.append(driveImg(u,""));else a.textContent=initials(p);return a}
const gword=(p,m,f,u)=>p?.sex==="M"?m:p?.sex==="F"?f:(u||m+"/"+f);

/* ---------- index ---------- */
function reindex(){S.famc={};S.fams_={};for(const f of Object.values(S.fams)){for(const c of f.children||[])(S.famc[c]=S.famc[c]||[]).push(f.id);for(const s of[f.husb,f.wife])if(s)(S.fams_[s]=S.fams_[s]||[]).push(f.id)}}
const P=id=>S.people[id];
function parentsOf(id){const out=[];for(const fid of S.famc[id]||[]){const f=S.fams[fid];if(!f)continue;if(f.husb&&P(f.husb))out.push(f.husb);if(f.wife&&P(f.wife))out.push(f.wife)}return out}
function birthFam(id){const l=S.famc[id]||[];return l.length?S.fams[l[0]]:null}
function father(id){const f=birthFam(id);return f&&f.husb&&P(f.husb)?f.husb:null}
function mother(id){const f=birthFam(id);return f&&f.wife&&P(f.wife)?f.wife:null}
function spouseFams(id){return(S.fams_[id]||[]).map(f=>S.fams[f]).filter(Boolean)}
function spouseIn(f,id){const o=f.husb===id?f.wife:f.husb;return o&&P(o)?o:null}
function childrenOf(id){const s=new Set();for(const f of spouseFams(id))for(const c of f.children||[])if(P(c))s.add(c);return[...s]}
function siblingsOf(id){const s=new Set();for(const fid of S.famc[id]||[]){const f=S.fams[fid];for(const c of f?.children||[])if(c!==id&&P(c))s.add(c)}return[...s]}

    S.canWrite?el("div",{class:"sect"},el("h3",{text:"ייבוא"}),el("p",{class:"hint",text:Object.keys(S.people).length?"ייבוא קובץ GED או גיבוי JSON יחליף את כל העץ הקיים. כדאי לייצא גיבוי לפני כן.":"ייבוא קובץ GED (למשל מ-MyHeritage) או גיבוי JSON."}),el("button",{class:"btn",onclick:()=>$("#file-ged").click()},"בחירת קובץ לייבוא")):null,
    el("div",{class:"foot"},el("button",{class:"btn",onclick:closeDialog},"סגירה")))};
function exportFile(name,data){const u=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"}));const a=el("a",{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("הקובץ ירד למחשב.")}
$("#file-ged").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const txt=await f.text();let data;
  try{if(/\.json$/i.test(f.name)){const j=JSON.parse(txt);data={people:j.people,families:j.families,research:j.research||{},meta:j.meta||{}}}else data=parseGED(txt)}catch(err){toast("לא הצלחתי לקרוא את הקובץ: "+err.message,true);return}
  const n=Object.keys(data.people||{}).length;if(!n){toast("לא נמצאו אנשים בקובץ.",true);return}
  const existing=Object.keys(S.people).length;
  const go=async()=>{closeDialog();await importAll(data)};
  if(existing){const inp=el("input",{id:"cf",placeholder:"להחלפה הקלד/י: החלף"});openDialog(el("h2",{text:"להחליף את כל העץ?"}),el("p",{text:`בקובץ ${n} אנשים. העץ הנוכחי (${existing} אנשים) יימחק ויוחלף. (התמונות והמסמכים נשארים ב-Drive.)`}),inp,el("div",{class:"foot"},el("button",{class:"btn danger",onclick:()=>{if(inp.value.trim()==="החלף")go();else toast("צריך להקליד: החלף",true)}},"החלפה"),el("button",{class:"btn",onclick:closeDialog},"ביטול")))}
  else go()});
async function importAll(data){const strip=o=>{const x={...o};delete x.id;delete x.famc;delete x.fams;return x};const now=Date.now();
  for(const id of Object.keys(S.people))if(!data.people[id])G.deleted.people[id]=now;for(const id of Object.keys(S.fams))if(!(data.families||{})[id])G.deleted.families[id]=now;
  S.people={};for(const[k,p]of Object.entries(data.people))S.people[k]={...blank(),...strip(p),id:k,updatedAt:now};
  S.fams={};for(const[k,f]of Object.entries(data.families||{}))S.fams[k]={...strip(f),id:k,updatedAt:now};
  for(const[k,r]of Object.entries(data.research||{}))S.research[k]={...strip(r),id:k,updatedAt:now};
  for(const c of["people","families","research"])for(const k of Object.keys(c==="people"?S.people:c==="families"?S.fams:S.research))delete G.deleted[c][k];
  if(data.meta&&Object.keys(data.meta).length)S.meta={...data.meta,updatedAt:now};
  if(data.meta?.focusDefault)S.focus=data.meta.focusDefault;
  dirty=true;clearTimeout(saveT);setSaveState("שומר…");saveChain=saveChain.then(doSave,doSave);await saveChain;afterData();toast("הייבוא הושלם ונשמר ב-Drive.")}

document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();$("#q").focus()}});
let lastW=window.innerWidth,rzT=0;window.addEventListener("resize",()=>{if(Math.abs(window.innerWidth-lastW)<40)return;lastW=window.innerWidth;clearTimeout(rzT);rzT=setTimeout(()=>{if(S.view==="tree"&&S.focus){const svg=$("#inner svg.links");if(svg)drawLinks(svg,$("#inner"))}},250)});
$("#btn-out").onclick=signOut;
boot();
</script>
